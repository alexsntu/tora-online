{{ nav_data|json_script:"nav-data" }}
<div class="quick-nav" data-book-slug="{{ book.slug }}" data-current-chapter="{{ current_chapter|default:'' }}">
    <p class="quick-nav-hint">Чтобы перейти к нужному фрагменту текста, выберите главу и стих.</p>

    <div class="nav-row-label">Глава</div>
    <div class="nav-row nav-chapters"></div>
    <select class="nav-select nav-select-chapters" aria-label="Глава"></select>

    <div class="nav-row-label">Стих</div>
    <div class="nav-row nav-verses"></div>
    <select class="nav-select nav-select-verses" aria-label="Стих"></select>

    <label class="filter-toggle">
        <input type="checkbox" class="filter-materials-checkbox">
        Показывать только стихи с комментариями <span class="filter-star">✦</span>
    </label>

    <label class="filter-toggle">
        <input type="checkbox" class="highlight-materials-checkbox">
        Включить подсветку глав и стихов с комментариями <span class="filter-star">✦</span>
    </label>
</div>
<script>
(function () {
    var container = document.currentScript.previousElementSibling;
    var navData = JSON.parse(document.getElementById('nav-data').textContent);
    var bookSlug = container.dataset.bookSlug;
    var chaptersRow = container.querySelector('.nav-chapters');
    var versesRow = container.querySelector('.nav-verses');
    var chaptersSelect = container.querySelector('.nav-select-chapters');
    var versesSelect = container.querySelector('.nav-select-verses');

    var chapters = Object.keys(navData).map(Number).sort(function (a, b) { return a - b; });
    var activeChapter = Number(container.dataset.currentChapter) || chapters[0];
    var filterOn = false;
    var highlightOn = false;

    function chapterHasMaterials(ch) {
        return (navData[ch] || []).some(function (pair) { return pair[1]; });
    }

    function renderChapters() {
        chaptersRow.innerHTML = '';
        var visibleChapters = filterOn ? chapters.filter(chapterHasMaterials) : chapters;
        if (filterOn && visibleChapters.length && visibleChapters.indexOf(activeChapter) === -1) {
            activeChapter = visibleChapters[0];
        }
        visibleChapters.forEach(function (ch) {
            var hasMaterials = chapterHasMaterials(ch);
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'nav-btn'
                + (ch === activeChapter ? ' active' : '')
                + (hasMaterials && highlightOn ? ' has-materials' : '');
            btn.textContent = ch;
            if (hasMaterials) { btn.title = 'В этой главе есть комментарии'; }
            btn.addEventListener('click', function () {
                activeChapter = ch;
                renderChapters();
                renderVerses();
            });
            chaptersRow.appendChild(btn);
        });

        chaptersSelect.innerHTML = '';
        visibleChapters.forEach(function (ch) {
            var hasMaterials = chapterHasMaterials(ch);
            var opt = document.createElement('option');
            opt.value = ch;
            opt.textContent = (hasMaterials && highlightOn ? '✦ ' : '') + 'Глава ' + ch;
            if (ch === activeChapter) { opt.selected = true; }
            chaptersSelect.appendChild(opt);
        });
    }

    function goToVerse(chapter, verse) {
        var anchorId = 'v-' + chapter + '-' + verse;
        var el = document.getElementById(anchorId);
        if (el) {
            el.scrollIntoView({ behavior: 'auto', block: 'center' });
            history.replaceState(null, '', '#' + anchorId);
        } else {
            window.location.href = '/' + bookSlug + '/' + chapter + '/#' + anchorId;
        }
    }

    function renderVerses() {
        versesRow.innerHTML = '';
        var verses = navData[activeChapter] || [];
        if (filterOn) { verses = verses.filter(function (pair) { return pair[1]; }); }
        verses.forEach(function (pair) {
            var verse = pair[0], hasMaterials = pair[1];
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'nav-btn' + (hasMaterials && highlightOn ? ' has-materials' : '');
            btn.textContent = verse;
            if (hasMaterials) { btn.title = 'Есть комментарий'; }
            btn.addEventListener('click', function () {
                goToVerse(activeChapter, verse);
            });
            versesRow.appendChild(btn);
        });

        versesSelect.innerHTML = '';
        var placeholder = document.createElement('option');
        placeholder.textContent = 'Выберите стих...';
        placeholder.disabled = true;
        placeholder.selected = true;
        versesSelect.appendChild(placeholder);
        verses.forEach(function (pair) {
            var verse = pair[0], hasMaterials = pair[1];
            var opt = document.createElement('option');
            opt.value = verse;
            opt.textContent = (hasMaterials && highlightOn ? '✦ ' : '') + 'Стих ' + verse;
            versesSelect.appendChild(opt);
        });
    }

    renderChapters();
    renderVerses();

    chaptersSelect.addEventListener('change', function () {
        activeChapter = Number(this.value);
        renderChapters();
        renderVerses();
    });
    versesSelect.addEventListener('change', function () {
        goToVerse(activeChapter, Number(this.value));
    });

    var filterCheckbox = container.querySelector('.filter-materials-checkbox');
    filterCheckbox.addEventListener('change', function () {
        filterOn = this.checked;
        renderChapters();
        renderVerses();

        var rows = document.querySelectorAll('.verse-row');
        rows.forEach(function (row) {
            row.style.display = (filterOn && !row.classList.contains('has-materials')) ? 'none' : '';
        });
        var markers = document.querySelectorAll('.chapter-marker');
        markers.forEach(function (marker) {
            var el = marker.nextElementSibling;
            var hasVisible = false;
            while (el && !el.classList.contains('chapter-marker')) {
                if (el.classList.contains('verse-row') && el.style.display !== 'none') {
                    hasVisible = true;
                    break;
                }
                el = el.nextElementSibling;
            }
            marker.style.display = (filterOn && !hasVisible) ? 'none' : '';
        });
    });

    var highlightCheckbox = container.querySelector('.highlight-materials-checkbox');
    highlightCheckbox.addEventListener('change', function () {
        highlightOn = this.checked;
        renderChapters();
        renderVerses();
    });
})();
</script>
