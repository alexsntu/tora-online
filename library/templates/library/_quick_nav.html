{{ nav_data|json_script:"nav-data" }}
<div class="quick-nav" data-book-slug="{{ book.slug }}" data-current-chapter="{{ current_chapter|default:'' }}">
    <div class="nav-row-label">Глава</div>
    <div class="nav-row nav-chapters"></div>
    <div class="nav-row-label">Стих</div>
    <div class="nav-row nav-verses"></div>
</div>
<script>
(function () {
    var container = document.currentScript.previousElementSibling;
    var navData = JSON.parse(document.getElementById('nav-data').textContent);
    var bookSlug = container.dataset.bookSlug;
    var chaptersRow = container.querySelector('.nav-chapters');
    var versesRow = container.querySelector('.nav-verses');

    var chapters = Object.keys(navData).map(Number).sort(function (a, b) { return a - b; });
    var activeChapter = Number(container.dataset.currentChapter) || chapters[0];

    function renderChapters() {
        chaptersRow.innerHTML = '';
        chapters.forEach(function (ch) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'nav-btn' + (ch === activeChapter ? ' active' : '');
            btn.textContent = ch;
            btn.addEventListener('click', function () {
                activeChapter = ch;
                renderChapters();
                renderVerses();
            });
            chaptersRow.appendChild(btn);
        });
    }

    function goToVerse(chapter, verse) {
        var anchorId = 'v-' + chapter + '-' + verse;
        var el = document.getElementById(anchorId);
        if (el) {
            el.scrollIntoView({ behavior: 'auto', block: 'center' });
            history.replaceState(null, '', '#' + anchorId);
        } else {
            window.location.href = '/' + bookSlug + '/' + chapter + '/#' + anchorId;
        }
    }

    function renderVerses() {
        versesRow.innerHTML = '';
        (navData[activeChapter] || []).forEach(function (pair) {
            var verse = pair[0], hasMaterials = pair[1];
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'nav-btn' + (hasMaterials ? ' has-materials' : '');
            btn.textContent = verse;
            if (hasMaterials) { btn.title = 'Есть комментарий'; }
            btn.addEventListener('click', function () {
                goToVerse(activeChapter, verse);
            });
            versesRow.appendChild(btn);
        });
    }

    renderChapters();
    renderVerses();
})();
</script>
