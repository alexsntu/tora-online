<html lang="ru">
<head>

            k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tora Online для Бней Ноах{% endblock %}</title>
    <meta name="theme-color" content="#7c3223">
    <meta name="author" content="Дмитрий Калашник">
    <meta name="description" content="{{ meta_description|default:"Уроки Торы для Бней Ноах от Дмитрия Калашника: авторские уроки на основе комментариев мудрецов с лингвистическим анализом. Электронная библиотека Торы и Танаха на русском и иврите." }}">
    {% if structured_data_json %}<script type="application/ld+json">{{ structured_data_json|safe }}</script>{% endif %}
    <link rel="manifest" href="{% static 'library/manifest.json' %}">
    <link rel="icon" href="{% static 'library/icons/favicon.ico' %}" sizes="any">
    <link rel="icon" href="{% static 'library/icons/icon-512.png' %}" type="image/png">
    <link rel="apple-touch-icon" href="{% static 'library/icons/apple-touch-icon.png' %}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tora Online">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'library/style.css' %}">
    <script defer src="https://unpkg.com/alpinejs@3/dist/cdn.min.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("/service-worker.js").catch(function () {});
            });
        }
        (function () {
            var saved = parseInt(localStorage.getItem("tora-font-scale"), 10);
            document.documentElement.style.fontSize = (isNaN(saved) ? 100 : saved) + "%";
        })();
    </script>
</head>
<body>
    <header class="site-header">
        <a class="site-title" href="{% url 'library:home' %}">
            <img class="site-emblem" src="{% static 'library/icons/logo-header.png' %}" alt="" width="256" height="256">
            <span>Тора онлайн для Бней Ноах</span>
        </a>
        <div class="site-header-tools">
            <a class="header-tool-link" href="{% url 'library:info' %}">О портале</a>
            <div class="font-size-control" role="group" aria-label="Размер шрифта">
                <button type="button" id="font-size-dec" aria-label="Уменьшить шрифт">А−</button>
                <button type="button" id="font-size-inc" aria-label="Увеличить шрифт">А+</button>
            </div>
        </div>
    </header>
    <main>
        {% if messages %}
        <ul class="site-messages">
            {% for message in messages %}
            <li class="site-message{% if message.tags %} site-message-{{ message.tags }}{% endif %}">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <script>
        (function () {
            var btn = document.getElementById("install-app-btn");
            var hint = document.getElementById("install-app-hint");
            if (!btn) return;

            var isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
            if (isStandalone) return;

            var isIOS = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase()) && !window.MSStream;
            var deferredPrompt = null;

            if (isIOS) {
                btn.classList.add("is-visible");
                btn.addEventListener("click", function () {
                    hint.classList.toggle("is-visible");
                });
                return;
            }

            window.addEventListener("beforeinstallprompt", function (e) {
                e.preventDefault();
                deferredPrompt = e;
                btn.classList.add("is-visible");
            });

            btn.addEventListener("click", function () {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                deferredPrompt.userChoice.finally(function () {
                    deferredPrompt = null;
                    btn.classList.remove("is-visible");
                });
            });

            window.addEventListener("appinstalled", function () {
                btn.classList.remove("is-visible");
                hint.classList.remove("is-visible");
            });
        })();
    </script>
    <script>
        (function () {
            var KEY = "tora-font-scale";
            var MIN = 85, MAX = 150, STEP = 10;
            var dec = document.getElementById("font-size-dec");
            var inc = document.getElementById("font-size-inc");
            if (!dec || !inc) return;

            function current() {
                var v = parseInt(localStorage.getItem(KEY), 10);
                return isNaN(v) ? 100 : v;
            }
            function apply(scale) {
                document.documentElement.style.fontSize = scale + "%";
                localStorage.setItem(KEY, scale);
            }
            dec.addEventListener("click", function () { apply(Math.max(MIN, current() - STEP)); });
            inc.addEventListener("click", function () { apply(Math.min(MAX, current() + STEP)); });
        })();
    </script>
    <script>
        function toraCopyVerseLink(chapter, verse, btnEl) {
            var url = window.location.href.split("#")[0] + "#v-" + chapter + "-" + verse;
            var done = function () {
                var original = btnEl.textContent;
                btnEl.textContent = "✓";
                setTimeout(function () { btnEl.textContent = original; }, 1500);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(done).catch(function () {});
            }
        }
        (function () {
            var m = /^#v-(\d+)-(\d+)$/.exec(window.location.hash);
            if (!m) return;
            var el = document.getElementById("v-" + m[1] + "-" + m[2]);
            if (!el) return;
            el.classList.add("verse-flash");
            setTimeout(function () { el.classList.remove("verse-flash"); }, 2200);
        })();
    </script>
</body>
</html>
