{% load static %}<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tora Online для Бней Ноах{% endblock %}</title>
    <meta name="theme-color" content="#7c3223">
    <meta name="description" content="Электронная библиотека Торы и Танаха на русском и иврите с видеоуроками и статьями для Бней Ноах">
    <link rel="manifest" href="{% static 'library/manifest.json' %}">
    <link rel="icon" href="{% static 'library/icons/icon-512.png' %}">
    <link rel="apple-touch-icon" href="{% static 'library/icons/apple-touch-icon.png' %}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tora Online">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'library/style.css' %}">
    <script defer src="https://unpkg.com/alpinejs@3/dist/cdn.min.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("/service-worker.js").catch(function () {});
            });
        }
    </script>
</head>
<body>
    <header class="site-header">
        <a class="site-title" href="{% url 'library:home' %}">
            <svg class="site-emblem" viewBox="0 0 100 100" aria-hidden="true">
                <polygon points="50,6 90,74 10,74" fill="none" stroke="currentColor" stroke-width="5"/>
                <polygon points="50,94 10,26 90,26" fill="none" stroke="currentColor" stroke-width="5"/>
            </svg>
            <span>Tora Online для Бней Ноах</span>
        </a>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
