{% load static %}<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tora Online для Бней Ноах{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'library/style.css' %}">
    <script defer src="https://unpkg.com/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body>
    <header class="site-header">
        <a class="site-title" href="{% url 'library:home' %}">
            <svg class="site-emblem" viewBox="0 0 100 100" aria-hidden="true">
                <polygon points="50,6 90,74 10,74" fill="none" stroke="currentColor" stroke-width="5"/>
                <polygon points="50,94 10,26 90,26" fill="none" stroke="currentColor" stroke-width="5"/>
            </svg>
            <span>Tora Online для Бней Ноах</span>
        </a>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
